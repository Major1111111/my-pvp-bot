<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="style.css">
    <title>TON Roulette</title>
</head>
<body>
    <div class="header">
        <div class="icon">🔄</div>
        <div class="total-pool">ВCEГО <span id="pool-amount">0.00</span> TON</div>
        <div class="icon">💬</div>
    </div>

    <div class="roulette-container">
        <div class="arrow"></div>
        <div id="wheel">
            <!-- Сюда JS вставит аватарки -->
        </div>
        <div class="center-circle">
            <div id="timer">00:00</div>
        </div>
    </div>

    <div class="footer-controls">
        <div class="btn-group">
            <button class="icon-btn">🎁</button>
            <button class="icon-btn">💎</button>
            <button class="icon-btn">⭐️</button>
        </div>
        <div class="balance-group">
            <span class="balance">💎 0</span>
            <button class="plus-btn">+</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
