`html
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Telegram Mini App Game</title>
    <style>
        /* Основной стиль как на скриншоте */
        body {
            background-color: #000; /* Глубокий черный */
            color: white;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        /* Контейнер для колеса */
        .wheel-container {
            position: relative;
            width: 300px;
            height: 300px;
            margin-bottom: 40px;
        }

        /* Само колесо (фиолетовый круг) */
        #wheel {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: #a020f0; /* Фиолетовый как на скрине */
            border: 8px solid #1c1c1e;
            transition: transform 5s cubic-bezier(0.15, 0, 0.15, 1);
            position: relative;
        }

        /* Стрелочка сверху */
        .arrow {
            position: absolute;
            top: -10px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 15px solid transparent;
            border-right: 15px solid transparent;
            border-top: 20px solid #ff3b30; /* Красная стрелка */
            z-index: 10;
        }

        /* Карточка игрока */
        .player-card {
            background: #1c1c1e; /* Темно-серая карточка */
            width: 90%;
            max-width: 350px;
            border-radius: 20px;
            padding: 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .avatar {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            background: #444;
        }

        .username {
            font-weight: 600;
            font-size: 16px;
        }

        .chance {
            font-size: 18px;
            font-weight: bold;
            text-align: right;
        }

        /* Кнопка Ставка */
        #betBtn {
            width: 90%;
            max-width: 350px;
            background: #34c759; /* Ярко-зеленый */
            color: white;
            border: none;
            padding: 18px;
            border-radius: 18px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
        }

        #betBtn:disabled {
            background: #222;
            color: #555;
        }
    </style>
</head>
<body>

    <div class="wheel-container">
        <div class="arrow"></div>
        <div id="wheel"></div>
    </div>
    <div class="player-card">
        <div class="user-info">
            <div class="avatar"></div>
            <div>
                <div class="username">@bo4st</div>
                <div style="color: #8e8e93; font-size: 12px;">Ты</div>
            </div>
        </div>
        <div class="chance">
            100.0%
            <div style="color: #8e8e93; font-size: 12px; font-weight: normal;">0.1 TON</div>
        </div>
    </div>

    <button id="betBtn">Сделать ставку</button>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        const wheel = document.getElementById('wheel');
        const betBtn = document.getElementById('betBtn');

        socket.on('start_spin', (data) => {
            console.log("Крутим колесо на угол:", data.deg);
            
            // КОРРЕКТНЫЙ СИНТАКСИС ТУТ:
            wheel.style.transform = `rotate(${data.deg}deg)`;
            betBtn.disabled = true;
            
            setTimeout(() => {
                alert("Победитель определен!");
                
                // Сброс анимации
                wheel.style.transition = "none";
                wheel.style.transform = "rotate(0deg)";
                
                setTimeout(() => {
                    wheel.style.transition = "transform 5s cubic-bezier(0.15, 0, 0.15, 1)";
                }, 100);

                betBtn.disabled = false;
                betBtn.innerText = "СДЕЛАТЬ СТАВКУ";
            }, 6000);
        });
    </script>
</body>
</html>
